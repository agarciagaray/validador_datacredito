            font-weight: bold;
            color: #2c3e50;
        }

            margin-top: 16px;
        }

        .stat {
            padding: 14px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;

        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;

        .stat.total {

        }

        .stat.ok {

        }

        .stat.error {

        }

        .stat.warn {
            background: #fef5e7;
            color: #d68910;

            color: #2874a6;
        }

        .stat.reg {

            color: #6c3483;

        <div class="panel hidden" id="tablePanel">

                </table>
            </div>
            <div class="instructions" id="instructions"></div>

        function procesarArchivo(file) {

            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMsg');

            progressContainer.style.display = 'block';
            errorBox.classList.add('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = 'Leyendo archivo...';

            try {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const texto = e.target.result;
                        const lineasRaw = texto.split(/\r?\n/);
                        while (lineasRaw.length > 0 && lineasRaw[lineasRaw.length - 1].trim() === '') lineasRaw.pop();

                        if (lineasRaw.length < 2)
                            throw new Error(`El archivo tiene solo ${lineasRaw.length} líneas. Se requieren mínimo 3 (Header + registros + Trailer).`);

                        progressText.textContent = `Archivo leído: ${lineasRaw.length} líneas`;
                        progressFill.style.width = '10%';

                        let tipoEntregaEsperado = null;
                        const matchNombre = file.name.match(/^(\d{6})\.(\d{8})\.([TFEPA])$/i);
                        if (matchNombre) {
                            tipoEntregaEsperado = matchNombre[3].toUpperCase();
                            metadataArchivo.codigoSuscriptor = matchNombre[1];
                            metadataArchivo.fechaArchivo = matchNombre[2];
                        } else {
                            resultadosGlobales.push(H('Nombre del archivo', `"${file.name}"`, 'Formato: SSSSSS.AAAAMMDD.T (ej: 284941.20260930.T)', 'OBSERVACIÓN', null, ''));
                        }

                        progressText.textContent = 'Validando header...';
                        const headerVal = validarHeader(lineasRaw[0], tipoEntregaEsperado);
                        resultadosGlobales.push(...headerVal.hallazgos);
                        const tipoEntrega = headerVal.tipoEntrega || tipoEntregaEsperado || 'T';
                        const tipoCuenta = headerVal.tipoCuenta || '';

                        progressFill.style.width = '20%';
                        progressText.textContent = 'Buscando trailer...';

                        let trailerIdx = lineasRaw.length - 1;
                        for (let i = lineasRaw.length - 1; i >= 0; i--) {
                            if (lineasRaw[i] && lineasRaw[i].startsWith('ZZZZZZZZZZZZZZZZZZ')) { trailerIdx = i; break; }
                        }

                        const totalLineasFisicas = lineasRaw.length;
                        const registrosDetalle = [];
                        let sumatoriaNovedades = 0;

                        progressText.textContent = `Validando ${trailerIdx - 1} registros de detalle...`;

                        for (let i = 1; i < trailerIdx; i++) {
                            const linea = lineasRaw[i];
                            if (!linea || linea.trim() === '') continue;
                            const resultado = validarDetalle(linea, i + 1, tipoEntrega, tipoCuenta);
                            resultadosGlobales.push(...resultado.hallazgos);
                            const valores = resultado.valoresCampo || {};
                            registrosDetalle.push({ linea: i + 1, valores, novedad: resultado.novedad });

                            const nov = (valores['2.15'] || '').trim();
                            if (esNumericoPuro(nov)) sumatoriaNovedades += parseInt(nov, 10);

                            if (i % 100 === 0) {
                                const pct = 20 + Math.round(((i - 1) / Math.max(trailerIdx - 1, 1)) * 70);
                                progressFill.style.width = pct + '%';
                                progressText.textContent = `Línea ${i} de ${trailerIdx - 1} (${Math.round((i / Math.max(trailerIdx - 1, 1)) * 100)}%)`;
                            }
                        }

                        progressFill.style.width = '90%';
                        progressText.textContent = 'Validando trailer...';
                        resultadosGlobales.push(...validarTrailer(lineasRaw[trailerIdx], totalLineasFisicas, sumatoriaNovedades, trailerIdx + 1));

                        if (tipoEntrega === 'P' && tipoCuenta !== '28')
                            resultadosGlobales.push(H('1.7 / Tipo de Cuenta', `Tipo entrega P con tipo de cuenta ${tipoCuenta}`, 'El tipo de entrega P solo aplica para cartera CRT (tipo cuenta 28)', 'ERROR BLOQUEANTE', null, ''));

                        if (tipoEntrega === 'E') {
                            const malas = registrosDetalle.filter(r => !['01', '02', '05'].includes((r.valores['2.15'] || '').trim()));
                            if (malas.length > 0)
                                resultadosGlobales.push(H('Tipo Entrega E - Novedades', `${malas.length} registros con novedades distintas de 01, 02, 05`, 'Tipo E solo acepta novedades 01, 02, 05', 'ERROR BLOQUEANTE', null, ''));
                        }
                        if (tipoEntrega === 'A') {
                            const noAperturas = registrosDetalle.filter(r => (r.valores['2.15'] || '').trim() !== '01');
                            if (noAperturas.length > 0)
                                resultadosGlobales.push(H('Tipo Entrega A - Novedades', `${noAperturas.length} registros con novedades distintas de 01`, 'Tipo A solo recibe aperturas de cuentas (novedad 01)', 'ERROR BLOQUEANTE', null, ''));
                        }

                        resultadosGlobales.push(H('Estructura del archivo', `${totalLineasFisicas} líneas procesadas (1 header + ${registrosDetalle.length} registros + 1 trailer)`, 'Estructura: Header + N registros + Trailer', 'CORREGIDO / OK', null, ''));

                        progressFill.style.width = '100%';
                        progressText.textContent = '100% · Completado';

                        metadataArchivo.totalLineas = totalLineasFisicas;
                        metadataArchivo.totalRegistros = registrosDetalle.length;
                        metadataArchivo.sumatoriaNovedades = sumatoriaNovedades;
                        metadataArchivo.tipoEntrega = tipoEntrega;
                        metadataArchivo.tipoCuenta = tipoCuenta;
                        metadataArchivo.codSuscriptor = headerVal.codSuscriptor;
                        metadataArchivo.fechaCorte = headerVal.fechaCorte;

                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            renderResumen();
                            renderTabla();
                            renderInstrucciones();
                            document.getElementById('resultsPanel').classList.remove('hidden');
                            document.getElementById('tablePanel').classList.remove('hidden');
                            const fileInfo = document.getElementById('fileInfo');
                            fileInfo.classList.remove('hidden');
                            fileInfo.innerHTML = `
            <strong>Archivo:</strong> ${metadataArchivo.nombre} ·
            <strong>Tamaño:</strong> ${(metadataArchivo.tamano / 1024).toFixed(1)} KB ·
            <strong>Líneas:</strong> ${metadataArchivo.totalLineas} ·
            <strong>Registros:</strong> ${metadataArchivo.totalRegistros} ·
            <strong>Tipo entrega:</strong> ${metadataArchivo.tipoEntrega} ·
            <strong>Suscriptor:</strong> ${metadataArchivo.codSuscriptor || '-'}
          `;
                        }, 300);

                    } catch (err) {
                        console.error('Error en procesamiento:', err);
                        errorBox.classList.remove('hidden');
                        errorMsg.innerHTML = `<pre>${err.message}\n\n${err.stack || ''}</pre>`;
                        progressContainer.style.display = 'none';
                    }
                };
                reader.onerror = function () {
                    errorBox.classList.remove('hidden');
                    errorMsg.innerHTML = `<pre>Error al leer el archivo: ${reader.error}</pre>`;
                    progressContainer.style.display = 'none';
                };
                reader.readAsText(file, 'UTF-8');
            } catch (err) {
                console.error('Error inicial:', err);
                errorBox.classList.remove('hidden');
                errorMsg.innerHTML = `<pre>${err.message}</pre>`;
                progressContainer.style.display = 'none';
            }
        }

        function agruparHallazgos(hallazgos) {
            const grupos = new Map();
            hallazgos.forEach(h => {
                const clave = `${h.campo}|${h.dictamen}`;
                if (!grupos.has(clave)) {
                    grupos.set(clave, { campo: h.campo, dictamen: h.dictamen, requerimiento: h.requerimiento, pos: h.pos, items: [] });
                }
                grupos.get(clave).items.push(h);
            });

            return Array.from(grupos.values()).map(g => {
                const n = g.items.length;
                const lineas = g.items.map(i => i.linea).filter(l => l !== null && l !== undefined);
                const valores = g.items.map(i => i.valor).filter(v => v !== undefined && v !== '');
                let topValores = '';
                if (valores.length > 0) {
                    const conteo = {};
                    valores.forEach(v => { const k = String(v).length > 30 ? String(v).substring(0, 30) + '…' : v; conteo[k] = (conteo[k] || 0) + 1; });
                    topValores = Object.entries(conteo).sort((a, b) => b[1] - a[1]).slice(0, 3)
                        .map(([v, c]) => `"${v}" (${c})`).join(', ');
                }
                let estado;
                if (n === 1) estado = g.items[0].estado;
                else {
                    estado = `${n} registros afectados`;
                    if (topValores) estado += `. Valores más frecuentes: ${topValores}`;
                }
                return { campo: g.campo, dictamen: g.dictamen, requerimiento: g.requerimiento, pos: g.pos, n, lineas, estado, esGrupo: n > 1 };
            });
        }

        function obtenerVista() {
            const base = modoVista === 'grouped' ? agruparHallazgos(resultadosGlobales) : resultadosGlobales;
            return filtroActual === 'all' ? base : base.filter(r => r.dictamen === filtroActual);
        }

        function renderResumen() {
            const grupos = agruparHallazgos(resultadosGlobales);
            const totalFilas = grupos.length;
            const errores = grupos.filter(r => r.dictamen === 'ERROR BLOQUEANTE').length;
            const obs = grupos.filter(r => r.dictamen === 'OBSERVACIÓN').length;
            const inc = grupos.filter(r => r.dictamen === 'INCONSISTENCIA').length;
            const ok = grupos.filter(r => r.dictamen === 'CORREGIDO / OK').length;
            const registrosAfectados = new Set(resultadosGlobales.filter(r => r.dictamen !== 'CORREGIDO / OK').map(r => r.linea).filter(l => l !== null && l !== undefined)).size;

            document.getElementById('summary').innerHTML = `
    <div class="stat total"><div class="stat-label">Aspectos con hallazgos</div><div class="stat-value">${totalFilas}</div></div>
    <div class="stat reg"><div class="stat-label">Registros afectados</div><div class="stat-value">${registrosAfectados}</div></div>
    <div class="stat error"><div class="stat-label">Errores bloqueantes</div><div class="stat-value">${errores}</div></div>
    <div class="stat warn"><div class="stat-label">Observaciones</div><div class="stat-value">${obs}</div></div>
    <div class="stat info"><div class="stat-label">Inconsistencias</div><div class="stat-value">${inc}</div></div>
    <div class="stat ok"><div class="stat-label">OK / Corregidos</div><div class="stat-value">${ok}</div></div>
  `;
        }

        function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        function renderTabla() {
            const datos = obtenerVista();
            const thead = document.getElementById('resultsHead');
            const tbody = document.getElementById('resultsBody');

            if (modoVista === 'grouped') {
                thead.innerHTML = `<tr>
      <th style="width:19%;">Aspecto / Campo</th>
      <th style="width:9%;">Posición (cols.)</th>
      <th style="width:31%;">Estado en el archivo</th>
      <th style="width:28%;">Requerimiento Manual v2.2</th>
      <th style="width:13%;">Dictamen</th>
    </tr>`;
                tbody.innerHTML = datos.map(r => {
                    const clase = r.dictamen.toLowerCase().replace(/\s*\//g, '').replace(/\s+/g, '-');
                    let estadoCell = escapeHtml(r.estado);
                    if (r.esGrupo && r.lineas.length > 0) {
                        const lista = r.lineas.length > 60 ? r.lineas.slice(0, 60).join(', ') + ` … (+${r.lineas.length - 60} más)` : r.lineas.join(', ');
                        estadoCell += `<details><summary>Ver líneas afectadas (${r.lineas.length})</summary><div class="lineas-list">Líneas: ${lista}</div></details>`;
                    }
                    return `<tr>
        <td class="campo-cell">${escapeHtml(r.campo)}</td>
        <td class="pos-cell">${escapeHtml(r.pos || '—')}</td>
        <td class="estado-cell">${estadoCell}</td>
        <td class="req-cell">${escapeHtml(r.requerimiento)}</td>
        <td><span class="dictamen ${clase}">${r.dictamen}</span></td>
      </tr>`;
                }).join('');
            } else {
                thead.innerHTML = `<tr>
      <th style="width:17%;">Aspecto / Campo</th>
      <th style="width:8%;">Posición (cols.)</th>
      <th style="width:6%;">Línea</th>
      <th style="width:31%;">Estado en el archivo</th>
      <th style="width:25%;">Requerimiento Manual v2.2</th>
      <th style="width:13%;">Dictamen</th>
    </tr>`;
                tbody.innerHTML = datos.map(r => {
                    const clase = r.dictamen.toLowerCase().replace(/\s*\//g, '').replace(/\s+/g, '-');
                    return `<tr>
        <td class="campo-cell">${escapeHtml(r.campo)}</td>
        <td class="pos-cell">${escapeHtml(r.pos || '—')}</td>
        <td class="linea-cell">${r.linea ?? '—'}</td>
        <td class="estado-cell">${escapeHtml(r.estado)}</td>
        <td class="req-cell">${escapeHtml(r.requerimiento)}</td>
        <td><span class="dictamen ${clase}">${r.dictamen}</span></td>
      </tr>`;
                }).join('');
            }
        }

        function renderInstrucciones() {
            const grupos = agruparHallazgos(resultadosGlobales);
            const errores = grupos.filter(r => r.dictamen === 'ERROR BLOQUEANTE');
            const inconsistencias = grupos.filter(r => r.dictamen === 'INCONSISTENCIA');
            const observaciones = grupos.filter(r => r.dictamen === 'OBSERVACIÓN');

            let html = '<h4>PLAN DE CORRECCIÓN PRIORITARIO</h4><ol>';
            if (errores.length > 0) {
                const totalReg = errores.reduce((s, e) => s + e.n, 0);
                html += `<li><strong>Corregir ${errores.length} aspectos con error bloqueante (${totalReg} registros)</strong> antes de reenviar. Sin esto, DataCrédito rechazará el archivo.</li>`;
            }
            if (inconsistencias.length > 0) {
                const totalReg = inconsistencias.reduce((s, e) => s + e.n, 0);
                html += `<li><strong>Revisar ${inconsistencias.length} aspectos con inconsistencias (${totalReg} registros)</strong>: coherencia entre campos (cuotas vs saldos, fechas, novedad vs estado).</li>`;
            }
            if (observaciones.length > 0) {
                const totalReg = observaciones.reduce((s, e) => s + e.n, 0);
                html += `<li><strong>Atender ${observaciones.length} aspectos con observaciones (${totalReg} registros)</strong>: no bloquean la carga pero afectan la calidad del reporte.</li>`;
            }
            html += '</ol>';
            document.getElementById('instructions').innerHTML = html;
        }

        function descargar(nombre, contenido, mime) {
            const blob = new Blob([contenido], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = nombre; a.click();
            URL.revokeObjectURL(url);
        }

        function generarMd() {
            const fecha = new Date().toLocaleString('es-CO');
            const datos = agruparHallazgos(resultadosGlobales);
            let md = `# INFORME TÉCNICO DE AUDITORÍA - ARCHIVO PLANO DATACRÉDITO\n\n`;
            md += `**Empresa:** ${metadataArchivo.codSuscriptor || 'N/A'} · **Archivo:** ${metadataArchivo.nombre} · **Fecha:** ${fecha}\n\n`;
            md += `**Líneas:** ${metadataArchivo.totalLineas || '-'} · **Registros:** ${metadataArchivo.totalRegistros || '-'} · **Tipo entrega:** ${metadataArchivo.tipoEntrega || '-'}\n\n`;
            md += `**Modo:** Agrupado por aspecto/campo · ${datos.length} aspectos con hallazgos\n\n`;
            md += `## Detalle de hallazgos\n\n`;
            md += `| Aspecto / Campo | Posición (cols.) | Registros afectados | Estado en el archivo | Requerimiento Manual v2.2 | Dictamen |\n`;
            md += `| --- | --- | --- | --- | --- | --- |\n`;
            datos.forEach(r => {
                const esc = s => String(s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
                md += `| ${esc(r.campo)} | ${esc(r.pos || '—')} | ${r.n} | ${esc(r.estado)} | ${esc(r.requerimiento)} | ${r.dictamen} |\n`;
            });
            const errores = datos.filter(r => r.dictamen === 'ERROR BLOQUEANTE');
            if (errores.length > 0) {
                md += `\n## Errores bloqueantes (corregir antes de reenviar)\n\n`;
                errores.forEach(r => {
                    md += `- **${r.campo}** (cols. ${r.pos || '—'}) — ${r.n} registro(s): ${r.requerimiento}\n`;
                    if (r.esGrupo && r.lineas.length > 0) md += `  Líneas: ${r.lineas.slice(0, 40).join(', ')}${r.lineas.length > 40 ? ' …' : ''}\n`;
                });
            }
            return md;
        }

        function generarCsv() {
            const datos = agruparHallazgos(resultadosGlobales);
            let csv = 'Aspecto / Campo;Posicion (cols.);Registros afectados;Lineas;Estado en el archivo;Requerimiento Manual v2.2;Dictamen\n';
            datos.forEach(r => {
                const esc = s => `"${String(s ?? '').replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                csv += `${esc(r.campo)};${esc(r.pos)};${r.n};${esc(r.esGrupo ? r.lineas.join(',') : (r.lineas[0] ?? ''))};${esc(r.estado)};${esc(r.requerimiento)};${esc(r.dictamen)}\n`;
            });
            return csv;
        }

        function generarHtml() {
            const fecha = new Date().toLocaleString('es-CO');
            const datos = agruparHallazgos(resultadosGlobales);
            let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe Auditoría</title>
<style>body{font-family:Arial,sans-serif;padding:20px;max-width:1400px;margin:0 auto;}h1{color:#1e3c72;}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px;}th{background:#2a5298;color:white;padding:10px;text-align:left;}
td{padding:8px 10px;border-bottom:1px solid #e5e8eb;vertical-align:top;}
.dictamen{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold;}
.error{background:#fdecea;color:#c0392b;}.obs{background:#fef5e7;color:#d68910;}.inc{background:#eaf4fc;color:#2874a6;}.ok{background:#e8f8ef;color:#1e8449;}
</style></head><body>`;
            html += `<h1>Informe Técnico de Auditoría (agrupado por campo)</h1>`;
            html += `<p><strong>Archivo:</strong> ${metadataArchivo.nombre} · <strong>Fecha:</strong> ${fecha} · <strong>Registros:</strong> ${metadataArchivo.totalRegistros || '-'}</p>`;
            html += `<table><thead><tr><th>Aspecto / Campo</th><th>Posición</th><th>Registros</th><th>Estado</th><th>Requerimiento</th><th>Dictamen</th></tr></thead><tbody>`;
            datos.forEach(r => {
                let clase = 'ok';
                if (r.dictamen.includes('ERROR')) clase = 'error';
                else if (r.dictamen.includes('OBSERVACIÓN')) clase = 'obs';
                else if (r.dictamen.includes('INCONSISTENCIA')) clase = 'inc';
                html += `<tr><td>${r.campo}</td><td>${r.pos || '—'}</td><td>${r.n}</td><td>${r.estado}</td><td>${r.requerimiento}</td><td><span class="dictamen ${clase}">${r.dictamen}</span></td></tr>`;
            });
            html += `</tbody></table></body></html>`;
            return html;
        }

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) procesarArchivo(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => { if (e.target.files.length > 0) procesarArchivo(e.target.files[0]); });

        document.querySelectorAll('.mode-btn').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                modoVista = b.dataset.mode;
                renderTabla();
            });
        });

        document.getElementById('filters').addEventListener('click', e => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
                e.target.classList.add('active');
                filtroActual = e.target.dataset.filter;
                renderTabla();
            }
        });

        document.getElementById('btnDownloadMd').addEventListener('click', () => {
            const nb = (metadataArchivo.nombre || 'archivo').replace('.txt', '');
            descargar(`INFORME_AUDITORIA_${nb}.md`, generarMd(), 'text/markdown;charset=utf-8');
        });
        document.getElementById('btnDownloadCsv').addEventListener('click', () => {
            const nb = (metadataArchivo.nombre || 'archivo').replace('.txt', '');
            descargar(`INFORME_AUDITORIA_${nb}.csv`, generarCsv(), 'text/csv;charset=utf-8');
        });
        document.getElementById('btnDownloadHtml').addEventListener('click', () => {
            const nb = (metadataArchivo.nombre || 'archivo').replace('.txt', '');
            descargar(`INFORME_AUDITORIA_${nb}.html`, generarHtml(), 'text/html;charset=utf-8');
        });
        document.getElementById('btnReset').addEventListener('click', () => {
            resultadosGlobales = []; metadataArchivo = {};
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('tablePanel').classList.add('hidden');
            document.getElementById('fileInfo').classList.add('hidden');
            document.getElementById('errorBox').classList.add('hidden');
            document.getElementById('progressContainer').style.display = 'none';
            fileInput.value = '';
        });
    </script>
</body>

</html>
